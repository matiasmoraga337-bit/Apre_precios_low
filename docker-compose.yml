services:
  postgres:
    image: postgres:16-alpine
    container_name: apre-precios-postgres
    environment:
      POSTGRES_DB: apre_precios
      POSTGRES_USER: apre
      POSTGRES_PASSWORD: apre_local
    ports:
      - "5432:5432"
    volumes:
      - apre-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apre -d apre_precios"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: apre-precios-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  apre-postgres-data:
