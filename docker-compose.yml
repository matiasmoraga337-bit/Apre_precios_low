services:
  postgres:
    image: postgres:16-alpine
    container_name: apre-precios-postgres
    environment:
      POSTGRES_DB: apre_precios
      POSTGRES_USER: apre
      POSTGRES_PASSWORD: apre_local
    ports:
      - "5432:5432"
    volumes:
      - apre-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apre -d apre_precios"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apre-postgres-data:
